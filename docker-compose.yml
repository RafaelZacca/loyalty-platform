# Local development only. Credentials are throwaway and match
# backend/src/LoyaltyPlatform.Api/appsettings.Development.json.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: loyalty
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: loyalty_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty -d loyalty"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
